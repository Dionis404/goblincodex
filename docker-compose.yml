services:
  astro:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - NODE_ENV=production
    networks:
      - shared-net
    restart: unless-stopped

networks:
  shared-net:
    external: true