services:
  astro:
    image: ghcr.io/dionis404/goblincodex:v1.43.0
    pull_policy: always
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ROUTERAI_API_KEY=${ROUTERAI_API_KEY}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID}
      - NODE_ENV=production
      # Единый API данных SFL (фермеры, лидерборды, аукционы, цены, кэш ферм)
      - SFL_API_URL=${SFL_API_URL:-http://sfl-api:8000}
    networks:
      - shared-net
      - web 
    restart: unless-stopped

networks:
  shared-net:
    external: true
  web:                 
    external: true