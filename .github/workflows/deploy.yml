name: Build & Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        env:
          DOCKER_BUILDKIT: 0
        run: docker build -t ghcr.io/dionis404/goblincodex:latest -t ghcr.io/dionis404/goblincodex:${{ github.ref_name }} .

      - name: Push image
        run: |
          docker push ghcr.io/dionis404/goblincodex:latest
          docker push ghcr.io/dionis404/goblincodex:${{ github.ref_name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Redeploy stack via Portainer API
        run: |
          curl -sS -X PUT \
            "${{ secrets.PORTAINER_URL }}/api/stacks/24/git/redeploy?endpointId=3" \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "prune": false,
              "pullImage": true,
              "repositoryReferenceName": "refs/heads/main",
              "repositoryAuthentication": false,
              "env": [
                {"name": "DATABASE_URL", "value": "'"${{ secrets.DATABASE_URL }}"'"},
                {"name": "NODE_ENV", "value": "production"}
              ]
            }'
          echo ""
          echo "✅ Stack redeploy triggered"
