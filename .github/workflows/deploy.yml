name: Build & Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        env:
          DOCKER_BUILDKIT: 0
        run: docker build -t ghcr.io/dionis404/goblincodex:latest -t ghcr.io/dionis404/goblincodex:${{ github.ref_name }} .

      - name: Push image
        run: |
          docker push ghcr.io/dionis404/goblincodex:latest
          docker push ghcr.io/dionis404/goblincodex:${{ github.ref_name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ghcr.io/dionis404/goblincodex:latest
            docker restart goblincodex-astro-1
            echo "✅ Deployed successfully"