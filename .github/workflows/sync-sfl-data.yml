name: Sync SFL Boosts Data

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if version unchanged'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check latest SFL release
        id: check
        run: |
          LATEST=$(curl -s https://api.github.com/repos/sunflower-land/sunflower-land/releases/latest | jq -r '.tag_name')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          CURRENT=""
          if [ -f src/data/.sfl-version ]; then
            CURRENT=$(cat src/data/.sfl-version | tr -d '[:space:]')
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          FORCE="${{ inputs.force }}"
          if [ "$LATEST" != "$CURRENT" ] || [ "$FORCE" = "true" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if up to date
        if: steps.check.outputs.needs_update == 'false'
        run: echo "SFL version ${{ steps.check.outputs.current }} is up to date, skipping."

      - name: Clone SFL repo (sparse)
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/sunflower-land/sunflower-land.git /tmp/sfl
          cd /tmp/sfl
          git sparse-checkout set src/features/game/types src/lib/i18n/dictionaries src/assets

      - name: Run extractor
        if: steps.check.outputs.needs_update == 'true'
        run: |
          python3 scripts/extract-sfl-boosts.py \
            --sfl-dir /tmp/sfl \
            --out ./src/data \
            --sprites-out ./public/sprites \
            --copy-sprites

      - name: Save version
        if: steps.check.outputs.needs_update == 'true'
        run: echo "${{ steps.check.outputs.latest }}" > src/data/.sfl-version

      - name: Commit and push
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ITEM_COUNT=$(jq 'length' src/data/boosts-catalog.json 2>/dev/null || echo "?")
          VERSION="${{ steps.check.outputs.latest }}"
          git commit -m "chore: sync SFL boosts data (${VERSION}, ${ITEM_COUNT} items)"

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          MAJOR=$(echo "$LAST_TAG" | sed -E 's/^v([0-9]+)\..*/\1/')
          MINOR=$(echo "$LAST_TAG" | sed -E 's/^v[0-9]+\.([0-9]+)\..*/\1/')
          PATCH=$(echo "$LAST_TAG" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+).*/\1/')
          NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"

          git tag "$NEW_TAG"
          git push origin main --tags
