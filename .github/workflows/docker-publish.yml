name: Build & publish image

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  IMAGE: ghcr.io/dionis404/goblincodex

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            # :latest = голова main — нужен для контентного автодеплоя на прод
            # (статьи идут на прод без тега, прод-стек смотрит на :latest).
            # Важно: main держим релизабельным — код, не готовый к продy, в main не льём.
            echo "tags=${IMAGE}:dev,${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # нужен предыдущий коммит, чтобы понять, что изменилось
      - name: Deploy via Komodo
        run: |
          # Теги -> прод, main -> dev. Но контентные коммиты из CMS
          # (статьи/картинки) сразу идут и на прод — тег для них не нужен.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            STACKS="goblincodex"
          else
            STACKS="goblincodexdev"
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              echo "Нет предыдущего коммита для сравнения — прод не трогаем"
            elif git diff --name-only "$BEFORE" HEAD | grep -qvE '^(src/content/|public/blog-images/)'; then
              echo "Есть кодовые изменения — прод не трогаем"
            else
              echo "Только контент (статьи/картинки) — деплоим и прод"
              STACKS="$STACKS goblincodex"
            fi
          fi
          for STACK in $STACKS; do
            curl -sf -X POST https://panel.belitser.ru/execute \
              -H "X-Api-Key: ${{ secrets.KOMODO_API_KEY }}" \
              -H "X-Api-Secret: ${{ secrets.KOMODO_API_SECRET }}" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"DeployStack\",\"params\":{\"stack\":\"$STACK\"}}"
            echo "deployed: $STACK"
          done
