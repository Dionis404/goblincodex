server {
    listen 80;
    server_name goblincodex.fun www.goblincodex.fun;

    # Максимальный размер загружаемых файлов
    client_max_body_size 10M;

    # Сжатие ответов origin (HTML/JSON/JS/CSS). На проде сейчас перед
    # приложением стоит Caddy+Cloudflare и сжатие уже делает он — эта
    # директива важна для docker-compose контура, где этот nginx единственный
    # reverse proxy перед astro.
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Иммутабельная статика: origin (см. src/middleware.ts) ставит свои
    # Cache-Control, но здесь дублируем на случай прямого доступа мимо
    # middleware и чтобы nginx не ходил в astro за повторными запросами
    # браузерного кэша вообще.
    location ~* ^/(?:_astro|sprites|blog-images|images)/ {
        proxy_pass http://astro:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        # Передаём все запросы на контейнер astro
        # astro — это имя сервиса в docker-compose, не localhost
        proxy_pass http://astro:4321;

        # Передаём заголовки чтобы Astro знал реальный IP пользователя
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
